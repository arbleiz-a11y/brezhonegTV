<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Méta-données pour les liens (Open Graph / Twitter) -->
    <meta property="og:title" content="Entraînement Breton - Thème & Version">
    <meta property="og:description" content="Application interactive d'entraînement pour apprendre le breton (thème et version).">
    <meta property="og:image" content="Gwenn_ha_du.svg">
    <meta name="twitter:card" content="summary_large_image">

    <title>Entraînement Breton - Thème & Version</title>
    <!-- Bootstrap CSS pour le responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5 max-w-custom">
     <div class="text-center mb-3">
        <img src="Gwenn_ha_du.svg" alt="Drapeau de la Bretagne (Gwenn ha du)" style="max-height: 80px; width: auto;">
    </div>
    <h1 class="text-center mb-4 text-primary">Deskiñ Brezhoneg</h1>

    <!-- Onglets principaux -->
    <ul class="nav nav-pills nav-fill mb-4 main-tabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" type="button" role="tab" data-tab="exercises" aria-selected="true">🎯 Exercices</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" type="button" role="tab" data-tab="dialogues" aria-selected="false">💬 Dialogues</button>
        </li>
    </ul>

    <section id="tab-exercises">
    <!-- Sélecteur de mode -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body text-center">
            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="mode" id="mode-all" value="all" checked>
                <label class="btn btn-outline-primary" for="mode-all">Tout</label>

                <input type="radio" class="btn-check" name="mode" id="mode-theme" value="theme">
                <label class="btn btn-outline-primary" for="mode-theme">Thème (FR -> BZH)</label>

                <input type="radio" class="btn-check" name="mode" id="mode-version" value="version">
                <label class="btn btn-outline-primary" for="mode-version">Version (BZH -> FR)</label>
            </div>
        </div>
    </div>

    <!-- Zone d'exercice -->
    <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
            <span class="badge bg-secondary mb-2" id="exercise-type-badge">Type</span>
            <h3 class="card-title mb-4" id="source-text">Chargement...</h3>
            
            <div class="mb-3">
                <input type="text" id="user-input" class="form-control form-control-lg" placeholder="Votre traduction..." autocomplete="off">
            </div>
            
            <button id="btn-check" class="btn btn-primary w-100 btn-lg">Vérifier</button>
        </div>
    </div>

    <!-- Zone de résultat (cachée par défaut) -->
    <div id="result-area" class="card shadow-sm d-none">
        <div class="card-body p-4">
            <h4 id="result-status" class="mb-3"></h4>
            <p class="fs-5"><strong>Correction :</strong> <span id="correct-answer" class="text-success"></span></p>
            <div class="alert alert-info mt-3">
                <strong>💡 Explication :</strong>
                <p id="explanation-text" class="mb-0 mt-1"></p>
            </div>
            <button id="btn-next" class="btn btn-success w-100 mt-2 btn-lg">Suivant ➡️</button>
        </div>
    </div>
    </section>

    <!-- Onglet Dialogues -->
    <section id="tab-dialogues" class="d-none">
        <!-- Choix du livre et de la leçon -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="btn-group w-100 mb-3" role="group" aria-label="Livre">
                    <input type="radio" class="btn-check" name="book" id="book-1" value="1" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="book-1">Livre 1</label>

                    <input type="radio" class="btn-check" name="book" id="book-2" value="2" autocomplete="off">
                    <label class="btn btn-outline-primary" for="book-2">Livre 2</label>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-semibold">Kentel (leçon)</span>
                    <div class="btn-group btn-group-sm">
                        <button id="lesson-prev" type="button" class="btn btn-outline-secondary" aria-label="Leçon précédente">‹ Préc.</button>
                        <button id="lesson-next" type="button" class="btn btn-outline-secondary" aria-label="Leçon suivante">Suiv. ›</button>
                    </div>
                </div>
                <div id="lesson-picker" class="lesson-picker" role="group" aria-label="Numéro de la leçon"></div>
            </div>
        </div>

        <!-- Diviz : le dialogue -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h2 id="dialogue-title" class="h4 mb-0">Chargement...</h2>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Versions affichées">
                        <input type="checkbox" class="btn-check" id="show-oral" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="show-oral">Oral</label>

                        <input type="checkbox" class="btn-check" id="show-written" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="show-written">Écrit</label>

                        <input type="checkbox" class="btn-check" id="show-fr" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="show-fr">Français</label>
                    </div>
                </div>
                <div id="dialogue-lines" class="dialogue"></div>
                <p id="dialogue-note" class="small text-muted mt-3 mb-0 d-none"></p>
            </div>
        </div>

        <!-- Geriaoueg : le vocabulaire -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h3 class="h5 mb-3">📖 Geriaoueg (vocabulaire)</h3>
                <div class="table-responsive">
                    <table class="table table-sm table-striped align-middle mb-0">
                        <thead>
                            <tr><th>Mot</th><th class="d-none d-sm-table-cell">Prononciation</th><th>Sens</th></tr>
                        </thead>
                        <tbody id="vocab-body"></tbody>
                    </table>
                </div>
                <p class="small text-muted mt-2 mb-0">° = nom féminin · * = forme de la langue parlée</p>
            </div>
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
