<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement Breton - Thème & Version</title>
    <!-- Bootstrap CSS pour le responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5 max-w-custom">
    <h1 class="text-center mb-4 text-primary">Deskiñ Brezhoneg</h1>
    
    <!-- Sélecteur de mode -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body text-center">
            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="mode" id="mode-all" value="all" checked>
                <label class="btn btn-outline-primary" for="mode-all">Tout</label>

                <input type="radio" class="btn-check" name="mode" id="mode-theme" value="theme">
                <label class="btn btn-outline-primary" for="mode-theme">Thème (FR -> BZH)</label>

                <input type="radio" class="btn-check" name="mode" id="mode-version" value="version">
                <label class="btn btn-outline-primary" for="mode-version">Version (BZH -> FR)</label>
            </div>
        </div>
    </div>

    <!-- Zone d'exercice -->
    <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
            <span class="badge bg-secondary mb-2" id="exercise-type-badge">Type</span>
            <h3 class="card-title mb-4" id="source-text">Chargement...</h3>
            
            <div class="mb-3">
                <input type="text" id="user-input" class="form-control form-control-lg" placeholder="Votre traduction..." autocomplete="off">
            </div>
            
            <button id="btn-check" class="btn btn-primary w-100 btn-lg">Vérifier</button>
        </div>
    </div>

    <!-- Zone de résultat (cachée par défaut) -->
    <div id="result-area" class="card shadow-sm d-none">
        <div class="card-body p-4">
            <h4 id="result-status" class="mb-3"></h4>
            <p class="fs-5"><strong>Correction :</strong> <span id="correct-answer" class="text-success"></span></p>
            <div class="alert alert-info mt-3">
                <strong>💡 Explication :</strong>
                <p id="explanation-text" class="mb-0 mt-1"></p>
            </div>
            <button id="btn-next" class="btn btn-success w-100 mt-2 btn-lg">Suivant ➡️</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
